services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: govreach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: govreach
      POSTGRES_PASSWORD: govreach_password
      POSTGRES_DB: govreach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: govreach-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
